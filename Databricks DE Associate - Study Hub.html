<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Databricks DE Associate — Intern Study Hub</title>
<style>
  :root{
    --bg:#f4f6fa;--card:#fff;--ink:#1c2230;--muted:#5f6b7c;--line:#e6e9f0;
    --brand:#ff5f3a;--brand2:#e8442a;--navy:#1b2540;--accent:#2f56d6;
    --ok:#13864f;--okbg:#e8f8ef;--amber:#9a6b00;--amberbg:#fff4df;--red:#c0392b;--redbg:#fdecea;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;font-size:14.5px;line-height:1.55;}
  .app{display:flex;min-height:100vh;}
  /* sidebar */
  .side{width:250px;flex:none;background:var(--navy);color:#cdd5e6;position:sticky;top:0;height:100vh;overflow:auto;padding-bottom:24px;}
  .side .top{padding:20px 20px 14px;}
  .side .badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:#fff;font-size:15px;letter-spacing:.3px;}
  .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--brand),var(--brand2));flex:none;}
  .side .tagline{font-size:12px;color:#8b97b5;margin-top:6px;}
  .nav{margin-top:8px;}
  .nav a{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:11px 20px;color:#cdd5e6;text-decoration:none;font-size:13.7px;font-weight:600;cursor:pointer;border-left:3px solid transparent;}
  .nav a:hover{background:rgba(255,255,255,.05);color:#fff;}
  .nav a.on{background:rgba(255,95,58,.14);border-left-color:var(--brand);color:#fff;}
  .nav a .pct{font-size:11px;color:#8b97b5;font-weight:700;}
  .nav a.on .pct{color:#ffb9a6;}
  .nav .grouplbl{font-size:10.5px;font-weight:800;letter-spacing:1.3px;color:#6b779b;padding:16px 20px 5px;}
  /* main */
  .main{flex:1;min-width:0;}
  .wrap{max-width:880px;margin:0 auto;padding:34px 36px 90px;}
  h1{font-size:27px;margin:0 0 4px;}
  h2{font-size:20px;margin:30px 0 6px;}
  h3{font-size:15.5px;margin:20px 0 6px;}
  p{margin:9px 0;}
  .lead{color:var(--muted);font-size:15px;}
  .facts{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 6px;}
  .fact{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:13px;}
  .fact b{display:block;font-size:17px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:16px 0;}
  .kicker{color:var(--brand2);font-size:12px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;}
  .obj{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;}
  .obj:first-child{border-top:none;}
  .obj input{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--ok);}
  .obj label{cursor:pointer;font-size:13.8px;}
  .obj.done label{color:var(--muted);text-decoration:line-through;}
  .notes p{font-size:14px;}
  .notes ul{margin:6px 0 10px 18px;} .notes li{margin:5px 0;font-size:14px;}
  code{background:#eef1f6;border-radius:5px;padding:1px 6px;font-size:12.7px;font-family:"SFMono-Regular",Menlo,Consolas,monospace;}
  pre{background:#141a2b;color:#d7deee;border-radius:10px;padding:12px 14px;font-size:12.7px;overflow:auto;font-family:"SFMono-Regular",Menlo,Consolas,monospace;line-height:1.5;}
  .vids{display:flex;flex-direction:column;gap:8px;}
  .vid{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:10px 13px;text-decoration:none;color:var(--ink);background:#fff;}
  .vid:hover{border-color:var(--brand);background:#fff7f5;}
  .play{width:30px;height:30px;border-radius:8px;background:#fff0ec;color:var(--brand2);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;}
  .vid .t{font-weight:600;font-size:13.7px;} .vid .s{font-size:11.5px;color:var(--muted);}
  /* quiz */
  .q{border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin:13px 0;background:#fff;}
  .q .qn{font-weight:700;font-size:14.3px;margin-bottom:4px;}
  .q .obj-tag{font-size:11px;color:var(--muted);margin-bottom:9px;}
  .opt{display:block;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:7px 0;font-size:13.7px;cursor:pointer;transition:.12s;}
  .opt:hover{border-color:#c5cfe6;background:#f7f9ff;}
  .opt.correct{border-color:#9fdcbb;background:var(--okbg);}
  .opt.wrong{border-color:#f2b9b1;background:var(--redbg);}
  .opt.dim{opacity:.6;}
  .opt.sel{border-color:var(--accent);background:#eef2ff;font-weight:700;}
  .expl{margin-top:9px;font-size:13px;background:#f6f8fc;border-left:3px solid var(--accent);border-radius:6px;padding:9px 12px;display:none;}
  .expl.show{display:block;}
  .askt{display:inline-block;margin-top:8px;font-size:12px;color:var(--accent);cursor:pointer;font-weight:700;text-decoration:none;}
  .askt:hover{text-decoration:underline;}
  .scorebar{display:flex;align-items:center;gap:12px;margin:6px 0 14px;flex-wrap:wrap;}
  .btn{border:none;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .btn.brand{background:var(--brand);color:#fff;} .btn.brand:hover{background:var(--brand2);}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .pillbig{font-size:13px;font-weight:800;background:var(--okbg);color:var(--ok);padding:5px 12px;border-radius:999px;}
  .res a{display:block;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--accent);font-weight:600;font-size:14px;}
  .res a:first-child{border-top:none;}
  .res a span{color:var(--muted);font-weight:400;font-size:12.5px;display:block;}
  .ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#e6e9f0 0);display:flex;align-items:center;justify-content:center;flex:none;}
  .ring i{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-style:normal;color:var(--ink);}
  .note{background:var(--amberbg);border:1px solid #f0dcab;color:var(--amber);border-radius:11px;padding:11px 15px;font-size:13.3px;margin:14px 0;}
  .reset{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;}

  /* ===== Feed-the-Duck: stats HUD + roaming corn-fed duck ===== */
  .duckhud{position:fixed;top:14px;right:16px;z-index:60;background:#fff;border:1px solid var(--line);border-radius:14px;
        box-shadow:0 6px 22px rgba(20,30,60,.13);padding:10px 14px;min-width:196px;}
  .duckhud .hud-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .duckhud .hud-name{font-size:12px;font-weight:800;color:var(--navy);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .duckhud .hud-lv{font-size:10px;font-weight:800;color:var(--brand2);text-transform:uppercase;letter-spacing:.5px;}
  .duckhud .hud-pts{font-size:22px;font-weight:900;color:var(--ink);line-height:1.1;margin:1px 0 2px;}
  .duckhud .hud-pts b{color:var(--brand2);}
  .duckhud .xpbar{height:7px;background:#eef1f6;border-radius:99px;overflow:hidden;margin:2px 0 4px;}
  .duckhud .xpfill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s;}
  .duckhud .sub{font-size:11px;font-weight:700;color:var(--muted);}
  .duckhud .flame{color:var(--brand2);}
  /* egg-lay + hatch */
  .egg{position:fixed;z-index:57;pointer-events:none;font-size:26px;animation:eggdrop .5s ease;}
  @keyframes eggdrop{0%{transform:translateY(-14px) scale(.6);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
  .egg.wiggle{animation:eggwig .7s ease-in-out;}
  @keyframes eggwig{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}50%{transform:rotate(14deg)}75%{transform:rotate(-10deg)}}
  .hatchling{position:fixed;z-index:58;pointer-events:none;font-size:30px;animation:hatchpop .9s ease forwards;}
  @keyframes hatchpop{0%{transform:scale(.2) translateY(6px);opacity:0}35%{transform:scale(1.3) translateY(-10px);opacity:1}70%{transform:scale(1) translateY(-14px)}100%{transform:scale(1) translateY(-34px);opacity:0}}
  .spark{position:fixed;z-index:58;pointer-events:none;font-size:15px;animation:sparkle .8s ease forwards;}
  .hatchcel{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;}
  .hatchcel-in{background:#fff;border:3px solid var(--brand);border-radius:20px;padding:22px 34px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.32);animation:celpop .5s cubic-bezier(.34,1.56,.64,1);}
  .hatchcel-t{font-size:24px;font-weight:900;color:var(--brand2);margin-top:4px;}
  .hatchcel-s{font-size:14px;color:var(--muted);}
  @keyframes celpop{0%{transform:scale(.3) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .confp{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:conf 1.9s ease-in forwards;}
  @keyframes conf{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(106vh) rotate(560deg);opacity:.9}}
  @keyframes sparkle{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.1) translateY(-20px);opacity:0}}

  /* roaming duck — waddles around the whole screen, never blocks clicks */
  .duck{position:fixed;left:40px;top:60vh;z-index:55;pointer-events:none;width:80px;height:93px;
        transition:left 2.6s linear, top 2.6s linear;will-change:left,top;filter:drop-shadow(0 4px 4px rgba(0,0,0,.18));}
  .duck .duck-flip{width:100%;height:100%;transition:transform .25s;}
  .duck .duck-bob{width:100%;height:100%;animation:waddle .52s ease-in-out infinite;transform-origin:50% 90%;}
  .duck .duck-fat{width:100%;height:100%;transition:transform .5s cubic-bezier(.34,1.56,.64,1);transform-origin:50% 82%;}
  .duck svg{width:100%;height:100%;display:block;overflow:visible;}
  @keyframes waddle{0%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}100%{transform:translateY(0) rotate(-3deg)}}
  /* walk cycle: legs alternate, wing swings, tuft bobs */
  .duck .d-legF{transform-box:fill-box;transform-origin:50% 6%;animation:stepF .52s ease-in-out infinite;}
  .duck .d-legB{transform-box:fill-box;transform-origin:50% 6%;animation:stepB .52s ease-in-out infinite;}
  .duck .d-wing{transform-box:fill-box;transform-origin:88% 14%;animation:wingsw .52s ease-in-out infinite;}
  .duck .d-tuft{transform-box:fill-box;transform-origin:50% 100%;animation:tuftw .52s ease-in-out infinite;}
  @keyframes stepF{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-12deg)}}
  @keyframes stepB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}}
  @keyframes wingsw{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
  @keyframes tuftw{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  .duck.eat .duck-fat{animation:nom .45s ease;}
  @keyframes nom{0%{transform:none}40%{transform:scale(1.14,.88)}70%{transform:scale(.95,1.06)}100%{transform:none}}
  .duck.dance .duck-bob{animation:dance .7s ease;}
  @keyframes dance{0%{transform:rotate(0)}25%{transform:rotate(-18deg) translateY(-9px)}50%{transform:rotate(0)}75%{transform:rotate(18deg) translateY(-9px)}100%{transform:rotate(0)}}
  .duck.sad .duck-bob{animation:shake .5s ease;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-6deg)}40%{transform:translateX(6px) rotate(6deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .kernel{position:fixed;z-index:56;pointer-events:none;width:9px;height:12px;
          border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
          background:radial-gradient(circle at 50% 32%,#ffe79a,#f3ad12);box-shadow:0 1px 2px rgba(0,0,0,.22);
          transition:left .55s ease-in, top .55s ease-in, transform .55s, opacity .55s;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .25s,transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  /* ===== Flashcards ===== */
  .flash{perspective:1200px;margin:14px 0;}
  .fcard{position:relative;height:230px;cursor:pointer;}
  .fc-inner{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d;}
  .fcard.flip .fc-inner{transform:rotateY(180deg);}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;
           display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;box-shadow:0 3px 12px rgba(20,30,60,.06);}
  .fc-back{transform:rotateY(180deg);background:#fbfcff;}
  .fc-face .lbl{position:absolute;top:12px;left:16px;font-size:10.5px;letter-spacing:1.2px;font-weight:800;color:var(--muted);text-transform:uppercase;}
  .fc-face .term{font-size:22px;font-weight:800;color:var(--navy);}
  .fc-face .def{font-size:15px;color:var(--ink);line-height:1.5;}
  .fc-face .hintflip{position:absolute;bottom:12px;font-size:11.5px;color:var(--muted);}
  .srs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
  .srs button{border-radius:10px;padding:11px 6px;font-weight:800;font-size:13px;border:1px solid var(--line);cursor:pointer;color:#fff;}
  .srs .again{background:#c0392b;} .srs .hard{background:#d98a00;} .srs .good{background:#2f56d6;} .srs .easy{background:#13864f;}
  .srs small{display:block;font-weight:600;font-size:10px;opacity:.9;}

  /* ===== Jeopardy ===== */
  .jboard{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0;}
  .jcat{background:var(--navy);color:#fff;border-radius:9px;padding:10px 8px;font-size:11.5px;font-weight:800;text-align:center;min-height:54px;display:flex;align-items:center;justify-content:center;line-height:1.25;}
  .jtile{background:linear-gradient(135deg,#2f56d6,#1e3aa8);color:#ffd56b;border:none;border-radius:9px;padding:16px 4px;font-size:18px;font-weight:900;cursor:pointer;transition:.12s;}
  .jtile:hover{filter:brightness(1.12);transform:translateY(-1px);}
  .jtile.solved{background:#e6e9f0;color:#aab2c4;cursor:default;transform:none;filter:none;}
  .modal{position:fixed;inset:0;background:rgba(15,20,38,.55);display:flex;align-items:center;justify-content:center;z-index:70;padding:18px;}
  .modal .box{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:22px 24px;box-shadow:0 18px 50px rgba(0,0,0,.3);}

  /* ===== Fill in the blank ===== */
  .fb-prompt{font-size:16px;background:#141a2b;color:#d7deee;border-radius:12px;padding:16px 18px;font-family:"SFMono-Regular",Menlo,Consolas,monospace;line-height:1.7;}
  .fb-prompt.concept{background:#fff;color:var(--ink);border:1px solid var(--line);font-family:inherit;font-size:16px;}
  .fb-input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin:12px 0;}
  .fb-input:focus{outline:none;border-color:var(--accent);}
  .fb-fb{border-radius:10px;padding:11px 14px;font-size:13.5px;margin-top:6px;display:none;}
  .fb-fb.show{display:block;}
  .fb-fb.ok{background:var(--okbg);color:var(--ok);border:1px solid #9fdcbb;}
  .fb-fb.no{background:var(--redbg);color:var(--red);border:1px solid #f2b9b1;}

  /* ===== AI tutor chip + panel ===== */
  .aichip{position:fixed;bottom:18px;right:18px;z-index:62;background:var(--navy);color:#fff;border:none;border-radius:999px;
          padding:11px 17px;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(20,30,60,.28);display:flex;align-items:center;gap:8px;}
  .aichip:hover{background:#26314f;}
  .aipanel{position:fixed;bottom:70px;right:18px;width:330px;max-width:calc(100vw - 36px);z-index:62;background:#fff;border:1px solid var(--line);
           border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.22);padding:16px 18px;display:none;}
  .aipanel.show{display:block;}
  .aipanel h4{margin:0 0 6px;font-size:15px;}
  .aipanel p{font-size:13px;color:var(--muted);margin:7px 0;}
  .aipanel .close{position:absolute;top:10px;right:14px;cursor:pointer;color:var(--muted);font-weight:800;}

  @media(max-width:760px){.side{display:none;} .duckhud{top:8px;right:8px;min-width:0;padding:6px 9px;} .duck{width:64px;height:74px;} .jboard{font-size:9px;}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="top">
      <div class="badge"><span class="dot"></span> Study Hub</div>
      <div class="tagline">Databricks Certified<br>Data Engineer — Associate</div>
    </div>
    <nav class="nav" id="nav">
      <a data-v="overview" class="on">Overview <span class="pct"></span></a>
      <a data-v="tips">💡 Exam tips</a>
      <div class="grouplbl">EXAM SECTIONS</div>
      <!-- section links injected -->
      <div class="grouplbl">PRACTICE</div>
      <a data-v="mock">Mock exam <span class="pct"></span></a>
      <a data-v="exam">📝 Exam simulator</a>
      <a data-v="flash">Flashcards <span class="pct" id="pct-flash"></span></a>
      <a data-v="review">🔁 Review mistakes</a>
      <a data-v="badges">🏅 Badges</a>
      <a data-v="leaderboard">🏆 Leaderboard</a>
      <div class="grouplbl">PLAY</div>
      <a data-v="jeopardy">🎯 Jeopardy</a>
      <a data-v="fillblank">⌨️ Fill the blank</a>
      <a data-v="shop">🎩 Duck shop</a>
      <div class="grouplbl">MORE</div>
      <a data-v="resources">Resources</a>
    </nav>
  </aside>

  <div class="main"><div class="wrap" id="view"></div></div>
</div>

<!-- Feed-the-Duck: points tracker HUD -->
<div class="duckhud" id="duckhud" title="Answer correctly to feed your duck!">
  <div class="hud-top"><span class="hud-name" id="hudName">You</span><span class="hud-lv" id="duckLv">Hatchling</span></div>
  <div class="hud-pts"><b id="duckXp">0</b> pts</div>
  <div class="xpbar"><div class="xpfill" id="duckFill"></div></div>
  <div class="sub"><span id="hudCorrect">✅ 0</span> &nbsp; <span class="flame" id="duckStreak">🔥 0</span> &nbsp; <span id="hudHatch">🥚 0</span></div>
</div>

<!-- the roaming corn-fed duck (waddles around the screen) -->
<div class="duck" id="duck">
  <div class="duck-flip" id="duckFlip"><div class="duck-bob"><div class="duck-fat" id="duckFat">
    <svg viewBox="0 0 150 175" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#1c150f" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
        <!-- back leg (planted) -->
        <g class="d-legB">
          <path d="M60 120 L49 150" fill="none" stroke="#bf6a34" stroke-width="8"/>
          <path d="M40 152 q9 -7 18 -2 q-2 8 -10 9 q-9 0 -8 -7 Z" fill="#bf6a34"/>
        </g>
        <!-- front leg (stepping) -->
        <g class="d-legF">
          <path d="M74 120 L94 140" fill="none" stroke="#bf6a34" stroke-width="8"/>
          <path d="M90 138 q10 -3 17 4 q-3 7 -11 6 q-9 -2 -6 -10 Z" fill="#bf6a34"/>
        </g>
        <!-- body+neck+head — the belly is a circle regenerated from fullness (balloons round) -->
        <path id="duckBody" class="d-body" d="M80.0 24.0 C85.8 22.7 93.5 30.0 97.0 34.0 C100.5 38.0 101.8 43.7 101.0 48.0 C100.2 52.3 94.2 53.7 92.0 60.0 C89.8 66.3 87.4 77.2 87.6 85.5 C87.9 93.9 94.8 102.8 93.3 110.2 C91.9 117.6 85.1 126.2 79.0 130.0 C72.9 133.8 63.6 134.9 56.7 133.1 C49.9 131.3 41.4 125.7 38.0 119.0 C34.6 112.3 34.2 102.6 36.2 92.8 C38.2 82.9 45.7 68.5 50.0 60.0 C54.3 51.5 57.0 48.0 62.0 42.0 C67.0 36.0 74.2 25.3 80.0 24.0 Z" fill="#eef4f7"/>
        <!-- belly shading (also follows fullness) -->
        <path id="duckShade" d="M45 110 C55 123 73 123 83 110 C73 117 55 117 45 110 Z" fill="#d6e4ef" stroke="none"/>
        <!-- wing (raised, swings) -->
        <path class="d-wing" d="M58 70 C44 65 27 69 17 82 C24 83 30 83 34 85 C29 87 35 89 39 90
                 C34 92 41 94 45 94 C55 91 61 81 58 70 Z" fill="#e7eef3"/>
        <!-- beak (brown) — corn target -->

g table<\/b> = incremental ingest/transform.<\/p>", "videos": [["PySpark joins & unions", "joins", "PySpark inner left broadcast join union tutorial"], ["Dedup & aggregations", "aggregates", "PySpark dropDuplicates approx_count_distinct agg tutorial"], ["Views vs materialized views vs streaming tables", "Gold objects", "Databricks materialized view streaming table vs view"]], "quiz": [{"q": "A huge fact table must be joined to a small dimension table. How do you avoid an expensive shuffle?", "opts": ["Broadcast the small dimension table", "Raise shuffle partitions to 5000", "Cross join then filter", "Cache both tables"], "a": 0, "obj": "Joins / broadcast", "e": "Broadcasting the small side ships it to all executors, avoiding a shuffle (governed by autoBroadcastJoinThreshold).", "doc": {"u": "https://spark.apache.org/docs/latest/sql-performance-tuning.html", "l": "Spark performance tuning"}}, {"q": "After union-ing two DataFrames you see duplicate rows. What is happening?", "opts": ["union removes duplicates automatically", "union keeps duplicates \u2014 apply distinct() to remove them", "union errors when duplicates exist", "Only unionByName removes duplicates"], "a": 1, "obj": "Set operations", "e": "In Spark, union/unionAll keep duplicates; use distinct() to dedup.", "doc": {"u": "https://spark.apache.org/docs/latest/sql-programming-guide.html", "l": "Spark SQL / DataFrames"}}, {"q": "You need to turn each element of an array column into its own row. Which operation?", "opts": ["split", "explode", "withColumn", "drop"], "a": 1, "obj": "Manipulate columns/rows", "e": "explode() expands array elements into separate rows.", "doc": {"u": "https://spark.apache.org/docs/latest/sql-programming-guide.html", "l": "Spark SQL / DataFrames"}}, {"q": "You need a fast, approximate count of distinct users over billions of rows. Which function?", "opts": ["count", "approx_count_distinct", "sum", "first"], "a": 1, "obj": "Aggregations", "e": "approx_count_distinct trades a little in", "Ships a small table to all executors to avoid a shuffle; controlled by spark.sql.autoBroadcastJoinThreshold."], ["union / unionAll", "Stack rows and KEEP duplicates; use distinct() to dedup."], ["explode()", "Turns each element of an array column into its own row."], ["dropDuplicates()", "Removes duplicate rows (optionally by a subset of columns)."], ["approx_count_distinct", "Fast approximate count of unique values for large data."], ["spark.sql.shuffle.partitions", "Sets the number of partitions produced after a shuffle."], ["View vs materialized view vs streaming table", "View recomputes on read; MV stores refreshed precomputed results; streaming table ingests incrementally."]]}, {"id": "d4", "title": "Working with Lakeflow Jobs", "weightHint": "Control flow, tasks & DAG, triggers, scheduling", "objectives": ["Implement control flow (retries, conditional/branching, looping) with Lakeflow Jobs", "Configure tasks (notebook, SQL, dashboard, pipeline) and dependencies as a DAG", "Implement schedules with trigger types: scheduled, file arrival, table update", "Choose between time-based and data-driven triggers based on data availability"], "notes": "\n    <h3>Lakeflow Jobs<\/h3>\n    <ul>\n      <li>A job orchestrates <b>tasks<\/b> \u2014 notebook, SQL, dashboard, and pipeline tasks \u2014 with dependencies that form a <b>DAG<\/b>.<\/li>\n      <li><b>Control flow:<\/b> automatic <b>retries<\/b>, <b>conditional/if-else<\/b> tasks (branching), and <b>for-each<\/b> loops over a set of inputs.<\/li>\n      <li><b>Repair run<\/b> re-executes only the failed task(s), keeping successful results.<\/li>\n    <\/ul>\n    <h3>Triggers &amp; scheduling<\/h3>\n    <ul>\n      <li><b>Scheduled<\/b> (time-based / cron), <b>file arrival<\/b> (runs when new files land), and <b>table update<\/b> (runs when a table changes).<\/li>\n      <li><b>Time-based<\/b> triggers fire on a clock; <b>data-driven<\/b> triggers (file arrival / table update) fire when data is actually ready \u2014 choose based on data availability and dependencies.<\/li>\n    <\/ul>", "videos": [["Lakeflow Jobs: tasks & dependencies", "DAG", "Databricks Lakeflow Jobs tasks dependencies DAG tutorial"], ["Triggers: scheduled, file arrival, table update", "triggers", "Databricks job trigger file arrival table update scheduled"], ["Control flow: conditional & for-each", "control flow", "Databricks Lakeflow Jobs conditional task for each loop retries"]], "quiz": [{"q": "A cleanup task must always drop temp tables regardless of whether the upstream transform succeeded or failed. Which run_if condition?", "opts": ["ALL_SUCCESS", "ALL_DONE", "NONE_FAILED", "AT_LEAST_ONE_SUCCESS"], "a": 1, "obj": "run_if conditions", "e": "ALL_DONE runs the task once all dependencies finish, regardless of their success/failure.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/control-flow", "l": "Job control flow"}}, {"q": "A reporting task should run only when every upstream task has succeeded (the default). Which run_if?", "opts": ["ALL_SUCCESS", "ALL_DONE", "AT_LEAST_ONE_FAILED", "ALL_FAILED"], "a": 0, "obj": "run_if conditions", "e": "ALL_SUCCESS (the default) runs the task only if all dependencies succeed.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/control-flow", "l": "Job control flow"}}, {"q": "In a 3-task job (A\u2192B\u2192C), Task B fails. After fixing B's code, how do you resume without re-running Task A?", "opts": ["Rerun the whole job from the start", "Use Repair Run and select the failed task and its downstream task(s)", "Trigger B and C as separate one-off jobs", "Clone the job without Task A"], "a": 1, "obj": "Repair run", "e": "Repair Run re-executes only the selected failed/downstream tasks, keeping A's successful output.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/repair-job-failures", "l": "Repair job failures"}}, {"q": "One task should start only after several independent upstream tasks all finish (fan-in). How do you configure it?", "opts": ["Add all the upstream tasks as its dependencies", "Put each upstream task in a separate job", "Use a cron trigger", "Use a SQL warehouse"], "a": 0, "obj": "DAG / task dependencies", "e": "Listing multiple upstream tasks as dependencies creates a fan-in in the DAG.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/", "l": "Lakeflow Jobs"}}, {"q": "A job should launch automatically whenever new files land in a monitored location. Which trigger?", "opts": ["A fixed hourly schedule", "A file arrival trigger", "Manual runs only", "A broadcast join"], "a": 1, "obj": "Trigger types", "e": "A file-arrival trigger is data-driven and fires when new files appear.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/triggers", "l": "Job schedules & triggers"}}, {"q": "A job should run only when a specific source table is updated. Which trigger type?", "opts": ["Scheduled (cron)", "Table update trigger", "Continuous forever", "Repair run"], "a": 1, "obj": "Data-driven triggers", "e": "A table-update trigger runs the job when the monitored table changes.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/triggers", "l": "Job schedules & triggers"}}, {"q": "A pipeline must run every night at 02:00. Which trigger is appropriate?", "opts": ["A file arrival trigger", "A scheduled (cron) trigger", "A table update trigger", "A for-each task"], "a": 1, "obj": "Time-based triggers", "e": "A scheduled/cron trigger runs on a fixed clock time.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/triggers", "l": "Job schedules & triggers"}}, {"q": "A custom JDBC ingestion notebook must run on a schedule as cheaply and reliably as possible. How should you operationalize it?", "opts": ["Run it by hand on a shared all-purpose cluster", "Schedule it as a job task on job compute", "Leave an all-purpose cluster running 24/7 for it", "Move it to a SQL warehouse"], "a": 1, "obj": "Operationalize notebooks with job compute", "e": "A scheduled job task on job compute is isolated and cost-efficient versus an interactive all-purpose cluster.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/triggers", "l": "Job schedules & triggers"}}, {"q": "You need to run the same task once for each item in a list of inputs. Which construct?", "opts": ["A for-each task", "A cross join", "COPY INTO", "A materialized view"], "a": 0, "obj": "Control flow / looping", "e": "A for-each task loops a task over an input array.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/control-flow", "l": "Job control flow"}}, {"q": "Part of the job's DAG should run only if a computed value meets a condition. Which construct?", "opts": ["An If/else condition task", "A broadcast join", "A VACUUM step", "A SQL warehouse"], "a": 0, "obj": "Control flow / branching", "e": "An If/else condition task adds branching based on task values, parameters, or expressions.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/control-flow", "l": "Job control flow"}}, {"q": "How are the tasks and their dependencies in a Lakeflow Job organized?", "opts": ["As a flat list run in parallel", "As a DAG (directed acyclic graph)", "As a single notebook", "As a SQL warehouse"], "a": 1, "obj": "DAG task graph", "e": "Tasks with dependencies form a DAG-based task graph.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/", "l": "Lakeflow Jobs"}}, {"q": "A task that calls a sometimes-flaky external API occasionally fails transiently. What should you configure?", "opts": ["Automatic task retries", "Disable the task", "Increase shuffle partitions", "Use a single-node cluster"], "a": 0, "obj": "Control flow / retries", "e": "Automatic retries recover from transient failures without manual reruns.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/control-flow", "l": "Job control flow"}}], "flashcards": [["Lakeflow Jobs", "Orchestrates notebook/SQL/dashboard/pipeline tasks with dependencies as a DAG."], ["DAG", "The directed acyclic task graph formed by a job's tasks and their dependencies."], ["Repair run", "Reruns only the failed task(s) of a job, keeping successful results."], ["Trigger types", "Scheduled (time), file arrival, and table update (data-driven)."], ["Time-based vs data-driven", "Time-based fires on a clock; data-driven fires when files land or a table updates."], ["Conditional & for-each tasks", "Conditional/if-else adds branching; for-each loops a task over inputs."]]}, {"id": "d5", "title": "Implementing CI/CD", "weightHint": "Git in workspace, Asset Bundles, targets, Databricks CLI", "objectives": ["Manage code in the workspace: branches, commit/push, pull requests via Databricks Git", "Understand environment config with Asset Bundle variables and overrides across dev/test/prod", "Deploy Asset Bundles to package and promote jobs, pipelines and assets across environments", "Understand the Databricks CLI to validate, deploy and manage bundles in CI/CD"], "notes": "\n    <h3>Git in the workspace<\/h3>\n    <p>Databricks <b>Git folders (Repos)<\/b> integrate Git: create and switch <b>branches<\/b>, <b>commit<\/b> and <b>push<\/b>, and open <b>pull requests<\/b> through the Git provider \u2014 standard dev workflow inside the workspace.<\/p>\n    <h3>Asset Bundles (Automation Bundles)<\/h3>\n    <ul>\n      <li>Infrastructure-as-code in <b>YAML<\/b> (<code>databricks.yml<\/code>): define <b>resources<\/b> (jobs, pipelines) and <b>targets<\/b> (per-environment).<\/li>\n      <li><b>Variables and overrides<\/b> let one codebase promote across <b>dev \u2192 test \u2192 prod<\/b> targets.<\/li>\n    <\/ul>\n    <pre>targets:\n  dev:  { mode: development }\n  prod: { mode: production }<\/pre>\n    <h3>Databricks CLI<\/h3>\n    <ul>\n      <li><code>databricks bundle validate<\/code> \u2014 check the bundle config.<\/li>\n      <li><code>databricks bundle deploy<\/code> \u2014 deploy/promote the bundle to a target.<\/li>\n    <\/ul>", "videos": [["Databricks Git folders & PRs", "Git workflow", "Databricks Repos Git folders branches pull request tutorial"], ["Asset Bundles: targets & variables", "bundles", "Databricks Asset Bundles databricks.yml targets variables tutorial"], ["Databricks CLI: validate & deploy", "CLI", "Databricks CLI bundle validate deploy tutorial"]], "quiz": [{"q": "A team wants a modular way to version, deploy, and orchestrate ETL pipelines with CI/CD and repeatability. Which feature fits?", "opts": ["Represent jobs as Unity Catalog models and promote via aliases", "Package logic as wheels in Volumes bound to tasks", "Rely on notebook revision history for versioning", "Use Databricks Asset Bundles (DABs), versioned in Git and promoted via automated CI/CD"], "a": 3, "obj": "DABs for CI/CD", "e": "DABs define resources + code as YAML, are version-controlled in Git, and promote across environments via CI/CD.", "doc": {"u": "https://docs.databricks.com/aws/en/dev-tools/bundles/ci-cd-bundles", "l": "Bundles in CI/CD"}}, {"q": "Where are per-environment (dev/staging/prod) configurations defined in a bundle?", "opts": ["resources", "targets", "secrets", "permissions"], "a": 1, "obj": "Bundle targets", "e": "targets hold environment-specific configuration and overrides in databricks.yml.", "doc": {"u": "https://docs.databricks.com/aws/en/dev-tools/bundles/settings", "l": "Bundle configuration"}}, {"q": "In a pull-request pipeline you want to check a bundle's configuration WITHOUT deploying it. Which command?", "opts": ["databricks bundle deploy", "databricks bundle validate", "databricks bundle destroy", "databricks jobs run"], "a": 1, "obj": "Databricks CLI", "e": "databricks bundle validate checks the configuration; deploy is used to actually deploy.", "doc": {"u": "https://docs.databricks.com/aws/en/dev-tools/bundles/ci-cd-bundles", "l": "Bundles in CI/CD"}}, {"q": "A CI job must deploy a bundle non-interactively (no manual confirmation). Which flag?", "opts": ["databricks bundle deploy --auto-approve", "databricks bundle validate --dry-run", "databricks bundle run --now", "databricks bundle deploy --interactive"], "a": 0, "obj": "CLI automation flags", "e": "--auto-approve lets the deploy proceed without interactive confirmation in automation.", "doc": {"u": "https://docs.databricks.com/aws/en/dev-tools/bundles/ci-cd-bundles", "l": "Bundles in CI/CD"}}, {"q": "You want a deploy to fail rather than disrupt a job that is currently running. Which flag helps?", "opts": ["--fail-on-active-runs", "--force", "--skip-validation", "--no-wait"], "a": 0, "obj": "Active-run safety", "e": "--fail-on-active-runs makes the deploy fail if there are active runs, protecting them.", "doc": {"u": "https://docs.databricks.com/aws/en/dev-tools/bundles/ci-cd-bundles", "l": "Bundles in CI/CD"}}, {"q": "Within Databricks Git folders, what can a developer do?", "opts": ["Only read files", "Create/switch branches, commit and push, and open pull requests", "Only run SQL", "Only schedule jobs"], "a": 1, "obj": "Git in the workspace", "e": "Git folders support branching, commit/push, and PRs through the Git provider.", "doc": {"u": "https://docs.databricks.com/aws/en/repos/repos-setup", "l": "Databricks Git folders"}}, {"q": "When are Databricks Asset Bundle variables resolved?", "opts": ["At deployment time (statically), not at runtime", "Only at cluster startup", "Randomly on each run", "They are never resolved"], "a": 0, "obj": "Bundle variable resolution", "e": "Bundle variables/overrides are resolved statically at deploy time, not dynamically at runtime.", "doc": {"u": "https://docs.databricks.com/aws/en/dev-tools/bundles/settings", "l": "Bundle configuration"}}, {"q": "How do you promote the SAME codebase across dev \u2192 staging \u2192 prod with a bundle?", "opts": ["Copy notebooks between workspaces by hand", "Use bundle targets with variable overrides", "Maintain three separate repositories", "Use Delta Sharing"], "a": 1, "obj": "Multi-environment deploys", "e": "Targets plus variable overrides let one bundle deploy to each environment.", "doc": {"u": "https://docs.databricks.com/aws/en/dev-tools/bundles/settings", "l": "Bundle configuration"}}, {"q": "What is the root configuration file of a Databricks Asset Bundle?", "opts": ["config.ini", "databricks.yml", "bundle.json", "setup.py"], "a": 1, "obj": "Bundle structure", "e": "databricks.yml is the bundle's root YAML config.", "doc": {"u": "https://docs.databricks.com/aws/en/dev-tools/bundles/reference", "l": "Bundle reference"}}, {"q": "In a bundle, where are the jobs and pipelines themselves defined?", "opts": ["targets", "resources", "secrets", "clusters"], "a": 1, "obj": "Bundle structure", "e": "resources define jobs/pipelines; targets hold per-environment overrides.", "doc": {"u": "https://docs.databricks.com/aws/en/dev-tools/bundles/reference", "l": "Bundle reference"}}, {"q": "What is the main advantage of DABs over configuring jobs by clicking in the UI?", "opts": ["Faster query execution", "Version-controlled, repeatable, promotable deployments", "No compute needed", "They only work in dev"], "a": 1, "obj": "DAB vs UI", "e": "DABs are IaC: reproducible and promotable across environments, unlike ad-hoc UI clicks.", "doc": {"u": "https://docs.databricks.com/aws/en/dev-tools/bundles/ci-cd-bundles", "l": "Bundles in CI/CD"}}, {"q": "Which command deploys a validated bundle to a target environment?", "opts": ["databricks bundle validate", "databricks bundle deploy", "git push (alone)", "databricks fs cp"], "a": 1, "obj": "Databricks CLI", "e": "databricks bundle deploy deploys/promotes the bundle to the chosen target.", "doc": {"u": "https://docs.databricks.com/aws/en/dev-tools/bundles/settings", "l": "Bundle configuration"}}], "flashcards": [["Databricks Git folders (Repos)", "Git integration in the workspace: branches, commit/push, and pull requests."], ["Asset Bundles", "YAML infrastructure-as-code (databricks.yml) defining resources and targets."], ["targets", "Bundle section holding per-environment (dev/test/prod) config and overrides."], ["Bundle variables/overrides", "Let one codebase be promoted across dev \u2192 test \u2192 prod."], ["databricks bundle deploy", "CLI command that deploys/promotes a bundle to a target."], ["databricks bundle validate", "CLI command that checks a bundle's configuration before deploy."]]}, {"id": "d6", "title": "Troubleshooting, Monitoring & Optimization", "weightHint": "Run history, Spark UI, skew/shuffle/spill, Liquid Clustering", "objectives": ["Identify job performance trends using Lakeflow Jobs run history vs baselines", "Use the Lakeflow Jobs UI to monitor pipeline health (statuses, DAG, run times, failures)", "Identify bottlenecks \u2014 skew, shuffling, disk spill \u2014 from Spark UI stage metrics", "Understand Liquid Clustering and predictive optimization", "Diagnose cluster startup failures, library conflicts and out-of-memory issues"], "notes": "\n    <h3>Monitoring jobs<\/h3>\n    <ul>\n      <li><b>Run history<\/b> compares current execution times against historical <b>baselines<\/b> to spot regressions.<\/li>\n      <li>The <b>Jobs UI<\/b> shows statuses, the <b>DAG<\/b> (to find upstream blockers), run times and failure rates.<\/li>\n    <\/ul>\n    <h3>Spark UI bottlenecks<\/h3>\n    <ul>\n      <li><b>Skew<\/b> \u2014 one task far slower than the rest (uneven data distribution).<\/li>\n      <li><b>Shuffle<\/b> \u2014 data moved across the cluster; heavy shuffle is costly.<\/li>\n      <li><b>Spill<\/b> \u2014 not enough memory, so data is written to disk (slow).<\/li>\n    <\/ul>\n    <h3>Layout optimization<\/h3>\n    <ul>\n      <li><b>Liquid Clustering<\/b> \u2014 auto-manages data layout on chosen keys (replaces manual partitioning + ZORDER).<\/li>\n      <li><b>Predictive optimization<\/b> \u2014 Databricks auto-runs OPTIMIZE (compaction) and VACUUM (cleanup).<\/li>\n    <\/ul>\n    <h3>Common failures<\/h3>\n    <p><b>Cluster startup failures<\/b> (quota/config), <b>library conflicts<\/b> (incompatible versions), and <b>out-of-memory<\/b> (reduce partition size, increase memory, avoid huge collects) \u2014 read driver/executor logs and the event log.<\/p>", "videos": [["Reading the Spark UI (skew, shuffle, spill)", "Spark UI", "Databricks Spark UI skew shuffle spill tutorial"], ["Monitoring jobs & run history", "monitoring", "Databricks Lakeflow Jobs run history monitor health tutorial"], ["Liquid Clustering & predictive optimization", "optimization", "Databricks Liquid Clustering predictive optimization"]], "quiz": [{"q": "A batch job's runtime doubled. In the Spark UI one task takes 10 min while others finish in 30 s, and Max shuffle read (5 GB) is far above the median (400 MB). What's the simplest fix that needs no code change?", "opts": ["Add more executors so the slow task finishes faster", "Confirm Adaptive Query Execution skew-join handling is enabled to split the oversized partition at runtime", "Lower spark.sql.shuffle.partitions to use fewer tasks", "Cache the input table"], "a": 1, "obj": "Identify bottlenecks (skew) in the Spark UI", "e": "The metrics indicate data skew; AQE skew-join handling automatically splits the oversized partition without code changes. Bigger clusters don't fix skew.", "doc": {"u": "https://docs.databricks.com/aws/en/optimizations/spark-ui-guide/", "l": "Diagnose with the Spark UI"}}, {"q": "AQE alone isn't resolving a severe skew on one hot join key. Which manual technique redistributes it?", "opts": ["Salt the skewed join key to spread it across partitions", "Broadcast the multi-terabyte table", "Disable AQE", "Switch to a single-node cluster"], "a": 0, "obj": "Mitigating skew", "e": "Salting the skewed key distributes its rows across partitions so no single task is overloaded.", "doc": {"u": "https://docs.databricks.com/aws/en/optimizations/spark-ui-guide/", "l": "Diagnose with the Spark UI"}}, {"q": "The Spark UI shows large 'spill' during a stage. What does that indicate?", "opts": ["A permissions error", "Tasks ran out of memory and wrote data to disk", "Files failed to load", "A cluster was deleted"], "a": 1, "obj": "Identify bottlenecks (spill)", "e": "Spill means insufficient memory forced Spark to write to disk, slowing the job.", "doc": {"u": "https://docs.databricks.com/aws/en/optimizations/spark-ui-guide/", "l": "Diagnose with the Spark UI"}}, {"q": "You suspect a job is slower than its usual baseline. Where do you confirm the regression?", "opts": ["Compare the Lakeflow Jobs run history against historical baselines", "Delete and recreate the job", "Randomly resize the cluster", "Ignore it and rerun"], "a": 0, "obj": "Job performance trends", "e": "Run history compares current execution times against historical baselines to surface regressions.", "doc": {"u": "https://docs.databricks.com/aws/en/jobs/", "l": "Lakeflow Jobs"}}, {"q": "You want OPTIMIZE and VACUUM maintenance to run automatically without scheduling them. What enables this?", "opts": ["Predictive optimization", "Delta Sharing", "Auto Loader", "A broadcast join"], "a": 0, "obj": "Predictive optimization", "e": "Predictive optimization automatically runs compaction (OPTIMIZE) and cleanup (VACUUM).", "doc": {"u": "https://docs.databricks.com/aws/en/tables/clustering", "l": "Liquid clustering & predictive optimization"}}, {"q": "A large table's layout needs ongoing tuning on frequently filtered keys, hands-off, as it grows. Which feature?", "opts": ["Manual partitioning + ZORDER on every write", "Liquid Clustering (auto-managed layout)", "Disable Delta", "Increase driver memory"], "a": 1, "obj": "Liquid Clustering", "e": "Liquid Clustering auto-manages the layout on chosen keys, replacing manual partitioning + ZORDER.", "doc": {"u": "https://docs.databricks.com/aws/en/tables/clustering", "l": "Liquid clustering & predictive optimization"}}, {"q": "A job repeatedly fails with out-of-memory errors on executors. A reasonable first step is to:", "opts": ["Collect the whole DataFrame to the driver", "Reduce data per task / add memory and avoid large driver collects", "Raise shuffle partiti ];

/* roaming duck refs + helpers */
var duckEl, flipEl, fatEl, bodyEl, shadeEl, duckDir=1, roamTimer=null;
var FAT_MIN=0.74, FAT_BASE=1.0, HATCH_AT=1.82;   // belly maxes out -> lays an egg

/* the body is ONE outline; only the belly anchors move, so just the stomach
   grows/shrinks with fullness (head, wing, legs stay the same size). */
function crClosed(pts){
  var n=pts.length, d="M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1)+" ";
  for(var i=0;i<n;i++){
    var p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    d+="C"+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+" "+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+" "
      +(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+" "+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+" "
      +p2[0].toFixed(1)+" "+p2[1].toFixed(1)+" ";
  }
  return d+"Z";
}
/* belly is a CIRCLE (centre BCX,BCY) whose radius grows with fullness, so the
   stomach balloons round instead of just getting wider. */
var BCX=64, BCY=104, BR0=30, BRK=26, BANG=[-38,12,60,104,150,202];
function bodyPath(g){
  var R=BR0+BRK*(g-1), pts=[[80,24],[97,34],[101,48],[92,60]];
  for(var i=0;i<BANG.length;i++){var a=BANG[i]*Math.PI/180; pts.push([BCX+R*Math.cos(a), BCY+R*Math.sin(a)]);}
  pts.push([50,60],[62,42]);
  return crClosed(pts);
}
function bellyShade(g){var R=(BR0+BRK*(g-1))*0.62;
  return "M"+(BCX-R).toFixed(0)+" "+(BCY+6)+" C"+(BCX-R*0.5).toFixed(0)+" "+(BCY+R).toFixed(0)+" "+(BCX+R*0.5).toFixed(0)+" "+(BCY+R).toFixed(0)+" "+(BCX+R).toFixed(0)+" "+(BCY+6)
    +" C"+(BCX+R*0.5).toFixed(0)+" "+(BCY+R*0.7).toFixed(0)+" "+(BCX-R*0.5).toFixed(0)+" "+(BCY+R*0.7).toFixed(0)+" "+(BCX-R).toFixed(0)+" "+(BCY+6)+" Z";}
function drawBelly(g){ if(bodyEl)bodyEl.setAttribute("d",bodyPath(g)); if(shadeEl)shadeEl.setAttribute("d",bellyShade(g)); }
function applyFat(){ drawBelly(state.fullness||1); }   // instant (boot/reset)
var gShown=null;
function tweenBelly(){
  if(!bodyEl)return;
  var target=state.fullness||1; if(gShown===null)gShown=target;
  var start=gShown, t0=performance.now(), dur=380;
  (function step(now){ var k=Math.min(1,(now-t0)/dur); var g=start+(target-start)*(0.5-0.5*Math.cos(Math.PI*k));
    gShown=g; drawBelly(g); if(k<1)requestAnimationFrame(step); })(performance.now());
}
function pulse(cls){ if(!duckEl)return; duckEl.classList.remove(cls); void duckEl.offsetWidth; duckEl.classList.add(cls);

function moveDuck(){
  if(!duckEl || !state.duckRoam)return;      // stays put when roaming is off
  var W=window.innerWidth, H=window.innerHeight, dw=duckEl.offsetWidth||74, dh=duckEl.offsetHeight||86;
  var tx=Math.max(6, Math.random()*(W-dw-6));
  var ty=Math.max(58, Math.random()*(H-dh-46));
  var cur=parseFloat(duckEl.style.left)||40;
  duckDir=(tx<cur)?-1:1;
  flipEl.style.transform="scaleX("+duckDir+")";
  duckEl.style.left=tx+"px"; duckEl.style.top=ty+"px";
}
function parkDuck(){   // tuck the duck into the bottom-left corner and stop moving
  if(!duckEl)return;
  duckDir=1; flipEl.style.transform="scaleX(1)";

function feedCorn(){
  if(!duckEl)return;
  var r=duckEl.getBoundingClientRect(), faceRight=duckDir>=0;
  var mx=r.left+(faceRight?r.width*0.74:r.width*0.26), my=r.top+r.height*0.28;
  for(var i=0;i<6;i++){(function(){ setTimeout(function(){
    var k=document.createElement("div"); k.className="kernel";
    var sx=mx+(faceRight?70:-70)+(Math.random()*50-25), sy=my-40+Math.random()*80;
    k.style.left=sx+"px"; k.style.top=sy+"px"; k.style.opacity="1";
    document.body.appendChild(k);
    requestAnimationFrame(function(){ k.style.left=mx+"px"; k.style.top=my+"px"; k.style.transform="scale(.4)"; k.style.opacity="0.15"; });
    setTimeout(function(){k.remove();},600);
  }, i*70); })();}
}
function hatchCelebrate(nn){
  var cel=document.createElement("div"); cel.className="hatchcel";
  var conf=""; var cols=["#ff5f3a","#f2c400","#2f56d6","#13864f","#ff6f61"];
  for(var i=0;i<16;i++){ conf+='<span class="confp" style="left:'+(Math.random()*100)+'%;background:'+cols[i%5]+';animation-delay:'+(Math.random()*0.35).toFixed(2)+'s"></span>'; }
  cel.innerHTML='<div class="hatchcel-in"><div style="font-size:60px;line-height:1">🐣</div><div class="hatchcel-t">Egg hatched!</div><div class="hatchcel-s">Duckling #'+nn+' joined your flock 🎉</div></div>'+conf;
  document.body.appendChild(cel); toast("🥚➜🐣 Your duck laid an egg!");
  setTimeout(function(){cel.remove();}, 2300);
}
function hatchEgg(){
  if(!duckEl){ state.fullness=FAT_BASE; state.ducksHatched++; save(state); Duck.render(); return; }
  var r=duckEl.getBoundingClientRect();
  var ex=r.left+r.width*0.5-13, ey=r.top+r.height-8;
  state.fullness=FAT_BASE; save(state); tweenBelly();       // belly deflates (egg laid)
  var egg=document.createElement("div"); egg.className="egg"; egg.textContent="🥚";
  egg.style.left=ex+"px"; egg.style.top=ey+"px"; document.body.appendChild(egg);
  setTimeout(function(){egg.classList.add("wiggle");},480);
  setTimeout(function(){
    egg.remove();
    for(var i=0;i<5;i++){(function(){var s=document.createElement("div");s.className="spark";s.textContent="✨";
      s.style.left=(ex+Math.random()*40-14)+"px"; s.style.top=(ey-10)+"px"; document.body.appendChild(s);
      setTimeout(function(){s.remove();},820);})();}
    var baby=document.createElement("div"); baby.className="hatchling"; baby.textContent="🐣";
    baby.style.left=ex+"px"; baby.style.top=ey+"px"; document.body.appendChild(baby);
    setTimeout(function(){baby.remove();},950);
    state.ducksHatched++; save(state);
    hatchCelebrate(state.ducksHatched);
    Duck.render(); checkBadges();
  }, 1180);
}
var Duck={
  render:function(){
    var xp=state.xp, L=levelFor(xp), N=nextLevel(xp);
    document.getElementById("hudName").textContent=state.name||"You";
    document.getElementById("duckLv").textContent=L.name;
    document.getElementById("duckXp").textContent=xp;
    document.getElementById("duckFill").style.width=(N?Math.round((xp-L.min)/(N.min-L.min)*100):100)+"%";
    document.getElementById("hudCorrect").textContent="✅ "+state.correct;
    document.getElementById("duckStreak").textContent="🔥 "+streak;
    document.getElementById("hudHatch").textContent="🥚 "+state.ducksHatched;
  },
  feed:function(xp,correct){
    if(correct){
      streak++; if(streak>state.maxStreak)state.maxStreak=streak; state.correct++;
      if(streak%5===0){xp+=25; toast("🔥 "+streak+" streak! +25 bonus XP");}
    } else { streak=0; }
    var before=levelFor(state.xp).name;
    if(xp>0){ state.xp+=xp; state.xpEarned+=xp; }
    if(correct){
      state.fullness=(state.fullness||1)+GAIN;              // belly grows
      feedCorn();
      if(state.fullness>=HATCH_AT){                          // stuffed -> lay an egg
        setTimeout(function(){ pulse("eat"); hatchEgg(); }, 380);
      } else {
        setTimeout(function(){ pulse("eat"); tweenBelly(); }, 380);
        if(streak>0 && streak%5===0) pulse("dance");
      }
    } else {
      state.fullness=Math.max(FAT_MIN,(state.fullness||1)-LOSS);  // belly shrinks
      pulse("sad"); tweenBelly();
    }
    save(state);
    var after=levelFor(state.xp).name;
    if(after!==before) toast("⬆️ Level up! Your duck is now a "+after);
    Duck.render(); checkBadges();
  },
  startRoaming:function(){
    duckEl=document.getElementById("duck"); flipEl=document.getElementById("duckFlip"); fatEl=document.getElementById("duckFat");
    bodyEl=document.getElementById("duckBody"); shadeEl=document.getElementById("duckShade");
    gShown=state.fullness||1; applyFat(); applyCosmetics();
    duckEl.style.left="40px"; duckEl.style.top=Math.round(window.innerHeight*0.58)+"px";
    if(roamTimer){clearInterval(roamTimer);roamTimer=null;}
    if(state.duckRoam){ setTimeout(moveDuck,500); roamTimer=setInterval(moveDuck,2800); }
    else { parkDuck(); }
    window.addEventListener("resize",function(){ if(parseFloat(duckEl.style.left)>window.innerWidth-40)duckEl.style.left=(window.innerWidth-80)+"px"; });
  }
};

  var key=osec+"#"+oqi;
  if(correct) delete state.missed[key]; else state.missed[key]=true;
  save(state);
}

function tallyQuiz(secId){
  var qs=document.querySelectorAll('.q[data-secid="'+secId+'"]');

    if(!q.dataset.answered)return;

  state.quiz[secId]={best:Math.max(correct,(state.quiz[secId]||{}).best||0),total:qs.length,last:correct};
  save(state);
  if(sc)sc.textContent="Score: "+correct+"/"+qs.length+(state.quiz[secId].best>correct?" (best "+state.quiz[secId].best+")":"");
}

/* ============================ FLASHCARDS ============================ */
var flashQueue=[], flashPos=0;
function buildQueue(){
  var now=Date.now(), due=[], fresh=[];
  allCards().forEach(function(x){var r=state.srs[x.key];
    if(!r)fresh.push(x); else if((r.due||0)<=now)due.push(x);});
  // due first, then new cards
  flashQueue=due.concat(fresh); flashPos=0;
}
function renderFlash(){
  setNav("flash");
  if(!flashQueue.length||flashPos>=flashQueue.length)buildQueue();
  var V=document.getElementById("view");
  var total=allCards().length, learned=cardsLearned();
  if(!flashQueue.length){
    V.innerHTML='<h1>Flashcards</h1><div class="card"><p>🎉 Nothing due right now — every card is scheduled for later. Come back, or '+
      '<span class="reset" onclick="resetSRS()">reset flashcard scheduling</span> to drill them all again.</p></div>';
    refreshPcts();return;
  }

var DAY=86400000;
function rateCard(rating){
  var x=flashQueue[flashPos]; if(!x)return;
  var r=state.srs[x.key]||{box:0,reps:0}; r.reps=(r.reps||0)+1;
  var now=Date.now();
  if(rating==="again"){ r.box=1; r.due=now; }
  else if(rating==="hard"){ r.box=Math.max(1,r.box); r.due=now+1*DAY; }
  else if(rating==="good"){ r.box=Math.min(5,(r.box||0)+1); r.due=now+[0,1,3,7,16,16][r.box]*DAY; if(firstSolve("card#"+x.key))Duck.feed(10,true); }
  else if(rating==="easy"){ r.box=Math.min(5,(r.box||0)+2); r.due=now+[0,2,5,12,30,30][r.box]*DAY; if(firstSolve("card#"+x.key))Duck.feed(12,true); }
  state.srs[x.key]=r; save(state); checkBadges();
  if(rating==="again"){ flashQueue.push(x); }   // re-show later this session
  flashPos++;
  renderFlash();
}

function openTile(secId,vi,val){
  var sec=EXAM.sections.find(function(s){return s.id===secId;});
  var q=sec.quiz[jMap[secId][vi]];
  var key=secId+"@"+val;
  var opts=q.opts.map(function(o,oi){return '<div class="opt" data-o="'+oi+'">'+String.fromCharCode(65+oi)+'. '+esc(o)+'</div>';}).join("");
  var m=document.createElement("div"); m.className="modal"; m.id="jmodal";
  m.innerHTML='<div class="box"><div class="kicker">'+esc(sec.title)+' · $'+val+'</div>'+
    '<div class="qn" style="font-weight:700;margin:8px 0 10px">'+esc(q.q)+'</div>'+opts+
    '<div class="expl" id="jx"></div></div>';
  document.body.appendChild(m);
  m.querySelectorAll(".opt").forEach(function(opt){
    opt.addEventListener("click",function(){
      if(m.dataset.done)return; m.dataset.done="1";
      var pick=parseInt(opt.dataset.o,10), ans=q.a, ok=pick===ans;
      m.querySelectorAll(".opt").forEach(function(o){var oi=parseInt(o.dataset.o,10);
        if(oi===ans)o.classList.add("correct"); else if(oi===pick)o.classList.add("wrong"); else o.classList.add("dim");});
      var x=document.getElementById("jx"); x.classList.add("show");
      x.innerHTML='<b>'+(ok?'Correct! +$'+val:'Not quite.')+'</b> '+esc(q.e)+docLink(q);
      state.games.jeopardy.solved[key]=ok?"ok":"no"; save(state);
      recordAnswer(secId, jMap[secId][vi], ok);
      if(ok){ if(firstSolve(secId+"#"+jMap[secId][vi])) Duck.feed(Math.round(val/10),true); } else Duck.feed(0,false);
      setTimeout(function(){m.remove();renderJeopardy();}, 1700);
    });
  });
  m.addEventListener("click",function(e){if(e.target===m && !m.dataset.done)m.remove();});
}

var examQ=null, examSel={}, examTimer=null, examEnd=0, examDone=false, examScore=null;
function fmtTime(ms){var s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}
function examSize(){return Math.min(45, quizPool().length);}
function startExam(){
  examQ=shuffle(quizPool()).slice(0, examSize()); examSel={}; examDone=false; examScore=null;
  examEnd=Date.now()+90*60*1000;
  renderExam();
  if(examTimer)clearInterval(examTimer);
  examTimer=setInterval(function(){var el=document.getElementById("examTimer");if(!el||examDone){clearInterval(examTimer);return;}
    var left=examEnd-Date.now(); el.textContent="⏱ "+fmtTime(left); if(left<=0){clearInterval(examTimer);submitExam();}},1000);
}
function pickExam(i,oi){ if(examDone)return; examSel[i]=oi;
  var qel=document.querySelector('.exq[data-i="'+i+'"]'); if(!qel)return;
  qel.querySelectorAll(".opt").forEach(function(o){o.classList.toggle("sel", +o.dataset.o===oi);});
  var el=document.getElementById("examProg"); if(el)el.textContent=Object.keys(examSel).length+" / "+examQ.length+" answered";
}
function submitExam(){
  if(examDone||!examQ)return; examDone=true; if(examTimer)clearInterval(examTimer);
  var correct=0, by={}, newXP=0;
  examQ.forEach(function(p,i){ var ok=examSel[i]===p.q.a; if(ok)correct++;
    by[p.s]=by[p.s]||{c:0,t:0}; by[p.s].t++; if(ok)by[p.s].c++;
    if(ok && firstSolve(p.s+"#"+p.qi)) newXP+=8;
    recordAnswer(p.s, p.qi, ok); });
  var pct=Math.round(correct/examQ.length*100);
  examScore={correct:correct,total:examQ.length,pct:pct,pass:pct>=80,by:by};
  state.xp+=newXP; state.xpEarned+=newXP; if(pct>state.bestExamPct)state.bestExamPct=pct;
  save(state); Duck.render(); checkBadges();
  toast((examScore.pass?"✅ Passed":"❌ Keep going")+" — "+pct+"%  (+"+newXP+" XP)");
  renderExam(); window.scrollTo(0,0);
}

function lbHeaders(c){ var k=(c.key||"").trim(); var h={"apikey":k}; if(/^eyJ/.test(k)) h["Authorization"]="Bearer "+k; return h; }
var Leaderboard={
  submit:function(cb){
    var c=lbCfg(); var name=(state.name||"").trim();
    if(!c.url||!c.key||!name){cb&&cb(false);return;}
    try{
      var h=lbHeaders(c); h["Content-Type"]="application/json"; h["Prefer"]="resolution=merge-duplicates,return=minimal";
      fetch(lbBase()+"/rest/v1/scores?on_conflict=name",{method:"POST",headers:h,cache:"no-store",
        body:JSON.stringify([{name:name,xp:state.xp,eggs:state.ducksHatched,correct:state.correct,color:state.shop.color,hat:state.shop.hat,faces:equippedFaces().join(","),updated_at:new Date().toISOString()}])
      }).then(function(r){ if(r.ok){cb&&cb(true);return;} r.text().then(function(t){cb&&cb(false,"HTTP "+r.status+" — "+((t||"").slice(0,180)));}); })
        .catch(function(e){cb&&cb(false,"Network/CORS: "+((e&&e.message)||e));});
    }catch(e){ cb&&cb(false,"Request failed: "+((e&&e.message)||e)); }
  },
  fetch:function(cb){
    var c=lbCfg(); if(!c.url||!c.key){cb(null,"Not configured");return;}
    var base=lbBase();
    if(!/^https:\/\/.+\..+/.test(base)){ cb(null,"The Project URL looks wrong: \""+base+"\". It should be like https://xxxx.supabase.co (no spaces/newlines)."); return; }
    try{
      fetch(base+"/rest/v1/scores?select=*&order=xp.desc&limit=50",{
        headers:lbHeaders(c), cache:"no-store"
      }).then(function(r){ return r.text().then(function(t){
        if(!r.ok){ cb(null,"HTTP "+r.status+" — "+(t||"").slice(0,180)); return; }
        var d; try{d=JSON.parse(t);}catch(e){ cb(null,"Unexpected response: "+(t||"").slice(0,180)); return; }
        if(Array.isArray(d)) cb(d); else cb(null,"Unexpected response: "+(t||"").slice(0,180));
      }); }).catch(function(e){ cb(null,"Network/CORS error: "+((e&&e.message)||e)); });
    }catch(e){ cb(null,"Request failed (bad URL?): "+((e&&e.message)||e)); }
  }
};
function saveLbSettings(){
  var u=document.getElementById("lbUrl").value.trim(), k=document.getElementById("lbKey").value.trim();
  try{localStorage.setItem("dbx-lb",JSON.stringify({url:u,key:k}));}catch(e){}
  toast("Leaderboard settings saved"); renderLeaderboard();
}

      '<div class="card"><div class="kicker">Turn it on (~15 min, free)</div>'+

      '<li>In the SQL editor, run the table + policy SQL from the README (see "Leaderboard").</li>'+
      '<li>In <b>Project Settings → API</b>, copy the <b>Project URL</b> and the <b>anon public</b> key.</li>'+
      '<li>Paste them below, or hard-code them in <code>app_template.html</code> so all interns share automatically.</li></ol>'+
      '<div style="margin-top:10px"><input class="fb-input" id="lbUrl" placeholder="https://xxxx.supabase.co" style="max-width:440px">'+
      '<input class="fb-input" id="lbKey" placeholder="anon public key" style="max-width:440px">'+
      '<button class="btn brand" onclick="saveLbSettings()">Save &amp; enable</button></div></div>';
    return;
  }
  V.innerHTML='<h1>🏆 Leaderboard</h1><p class="lead">Loading…</p>';
  var me=(state.name||"").trim();
  var lastWrite="";
  function show(rows,err){
    if(rows===null){
      V.innerHTML='<h1>🏆 Leaderboard</h1><div class="note"><b>Couldn\'t load the leaderboard.</b><br>Reason: '+esc(err||"unknown")+
        '<br><br>Checklist: the Project URL is the <code>https://…supabase.co</code> value (from Data API), the key is the <b>legacy anon</b> key (<code>eyJ…</code>), and you ran the table + read-policy SQL.</div>'+
        '<div class="scorebar" style="margin-top:10px"><button class="btn ghost" onclick="renderLeaderboard()">Retry</button> <button class="btn ghost" onclick="clearLb()">Change settings</button></div>';
      return;
    }
    var body=rows.map(function(r,i){var mine=r.name===me;
      return '<div class="obj" style="cursor:default;align-items:center;'+(mine?'background:var(--okbg);border-radius:8px':'')+'">'+
        '<div style="width:26px;font-weight:800;color:#5f6b7c">'+(i+1)+'</div>'+
        '<div style="flex:none;margin-right:8px">'+miniDuck(r.color,r.hat,r.faces)+'</div>'+
        '<div style="flex:1;font-weight:'+(mine?800:600)+'">'+esc(r.name||"—")+(mine?' (you)':'')+'</div>'+
        '<div style="font-weight:800">'+(r.xp||0)+' XP</div>'+
        '<div style="width:64px;text-align:right;color:#5f6b7c;font-size:12px">🥚 '+(r.eggs||0)+'</div></div>';
    }).join("") || '<p>No scores yet — be the first! (Set a display name on the Overview, answer a question, then Refresh.)</p>';
    var src=(LEADERBOARD_CFG&&LEADERBOARD_CFG.url)?"built-in config":"settings you pasted in this browser";
    V.innerHTML='<h1>🏆 Leaderboard</h1><p class="lead">Top interns by XP. Your score updates when you open this page.</p>'+
      '<p style="font-size:11.5px;color:#8b97b5">Connected to <b>'+esc(lbBase().replace(/^https?:\/\//,""))+'</b> · '+rows.length+' player(s) · via '+src+' '+esc(lastWrite)+'</p>'+
      '<div class="scorebar"><button class="btn ghost" onclick="renderLeaderboard()">Refresh</button> <button class="btn ghost" onclick="clearLb()">Reset connection</button>'+(me?'':' <span style="font-size:12px;color:var(--red)">Set a display name on the Overview to appear here</span>')+'</div>'+
      '<div class="card">'+body+'</div>';
  }
  // read now (fast), and submit in parallel; when the write lands, refresh to include yourself
  Leaderboard.fetch(show);
  Leaderboard.submit(function(ok,werr){ lastWrite = ok ? "· your score saved ✓" : "· ⚠️ save failed: "+(werr||"unknown"); Leaderboard.fetch(show); });
}
function clearLb(){ try{localStorage.removeItem("dbx-lb");}catch(e){} renderLeaderboard(); }

/* ============================ FILL THE BLANK ======================== */
var fbQueue=[], fbPos=0, fbCorrect=0;
function startFB(){
  fbQueue=EXAM.fillblank.slice();
  for(var i=fbQueue.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=fbQueue[i];fbQueue[i]=fbQueue[j];fbQueue[j]=t;}
  fbPos=0; fbCorrect=0;
}
function renderFillblank(){
  setNav("fillblank");
  if(!fbQueue.length)startFB();
  var V=document.getElementById("view");
  if(fbPos>=fbQueue.length){
    if(fbCorrect>state.games.fillblank.best){state.games.fillblank.best=fbCorrect;save(state);}
    V.innerHTML='<h1>⌨️ Fill the blank</h1><div class="card"><h3>Round complete!</h3>'+
      '<p>You got <b>'+fbCorrect+' / '+fbQueue.length+'</b> right. Best: '+state.games.fillblank.best+'.</p>'+
      '<button class="btn brand" onclick="startFB();renderFillblank();">Play again</button> <button class="btn ghost" onclick="clearFbSolved();save(state);toast(\'Reset \u2014 re-earn XP\');startFB();renderFillblank();">\ud83d\udd04 Reset quiz</button></div>';
    return;
  }
  var item=fbQueue[fbPos];
  var secTitle=(EXAM.sections.find(function(s){return s.id===item.sec;})||{}).title||"";
  V.innerHTML='<h1>⌨️ Fill the blank</h1><p class="lead">Type the missing term or keyword. '+(item.type==="code"?"Complete the code.":"Concept.")+'</p>'+
    '<div class="scorebar"><span class="pillbig">'+(fbPos+1)+' / '+fbQueue.length+' · ✓ '+fbCorrect+'</span><span style="font-size:12px;color:#5f6b7c">'+esc(secTitle)+'</span></div>'+
    '<div class="card"><div class="fb-prompt '+(item.type==="concept"?"concept":"")+'">'+esc(item.prompt).replace(/____/g,'<b style="color:var(--brand2)">____</b>')+'</div>'+
      '<input class="fb-input" id="fbIn" placeholder="your answer" autocomplete="off" autofocus>'+
      '<div style="font-size:12px;color:#5f6b7c">Hint: '+esc(item.hint)+'</div>'+
      '<div class="fb-fb" id="fbFb"></div>'+
      '<div style="margin-top:12px"><button class="btn brand" id="fbCheck">Check</button> <button class="btn ghost" id="fbNext" style="display:none">Next →</button></div>'+
    '</div>'+
    '<div style="text-align:center;margin-top:16px"><button class="btn ghost" onclick="clearFbSolved();save(state);toast(\'Reset \u2014 re-earn XP\');startFB();renderFillblank();">\ud83d\udd04 Reset quiz</button></div>';
  var inp=document.getElementById("fbIn");
  function check(){
    if(document.getElementById("fbNext").style.display!=="none")return;
    var val=(inp.value||"").trim().toLowerCase();
    var accepts=[item.answer].concat(item.accept||[]).map(function(a){return (a||"").toLowerCase();});
    var ok=accepts.indexOf(val)>=0 && val!=="";
    var fb=document.getElementById("fbFb"); fb.classList.add("show");
    fb.classList.add(ok?"ok":"no");
    fb.innerHTML=ok?('✓ Correct — <b>'+esc(item.answer)+'</b>'):('✗ Answer: <b>'+esc(item.answer)+'</b>');
    if(ok)fbCorrect++;
    if(ok){ if(firstSolve("fb#"+EXAM.fillblank.indexOf(item))) Duck.feed(12,true); } else Duck.feed(0,false);
    inp.disabled=true;
    document.getElementById("fbCheck").style.display="none";
    document.getElementById("fbNext").style.display="inline-block";
  }
  document.getElementById("fbCheck").onclick=check;
  document.getElementById("fbNext").onclick=function(){fbPos++;renderFillblank();};
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){if(document.getElementById("fbNext").style.display==="none")check();else{fbPos++;renderFillblank();}}});
  inp.focus();
}

function askTutorAbout(secId,qi){
  var sec=EXAM.sections.find(function(s){return s.id===secId;});
  var q=(sec?sec.quiz[qi]:null) || (secId==="mock"?null:null);
  var text;
  if(q){
    text="Explain this Databricks DE Associate question and why the answer is correct:\n\n"+q.q+"\n"+
      q.opts.map(function(o,i){return String.fromCharCode(65+i)+". "+o;}).join("\n")+
      "\nCorrect answer: "+String.fromCharCode(65+q.a)+". Topic: "+q.obj;
  } else { text="Explain this Databricks Data Engineer Associate topic."; }
  if(AI.mode==="hosted" && AI.ask){ AI.ask(text); }
  else {
    try{ navigator.clipboard.writeText(text).then(function(){toast("Question copied — paste it into the AI Tutor");}); }
    catch(e){ toast("Open the AI Tutor to ask about this"); }
    openAI();
  }
}
